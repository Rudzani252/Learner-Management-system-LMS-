[project]
name = "enterprise-mylms-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "numpy>=2.4.6",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
enterprise-mylms-application = "enterprise_mylms_application:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
